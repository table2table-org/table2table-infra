version: "3.8"

networks:
  table2table-net:
    external: true

secrets:
  maven-settings:
    file: ./settings.xml.template

services:
  discovery-server:
    build:
      context: ../table2table-discovery-service
      dockerfile: Dockerfile.dev
      secrets:
        - maven-settings
    container_name: discovery-server
    networks:
      - table2table-net
    ports:
      - "8761:8761"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://discovery-server:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  config-service:
    build:
      context: ../table2table-config-service
      dockerfile: Dockerfile.dev
      secrets:
        - maven-settings
    container_name: config-service
    networks:
      - table2table-net
    restart: unless-stopped
    depends_on:
      discovery-server:
        condition: service_started
    ports:
      - "8888:8080"
    healthcheck:
      test: ["CMD","curl","-f","http://config-service:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  api-gateway:
    build:
      context: ../table2table-gateway-service
      dockerfile: Dockerfile.dev
      secrets:
        - maven-settings
    container_name: api-gateway
    networks:
      - table2table-net
    restart: unless-stopped
    depends_on:
      discovery-server:
        condition: service_started
      config-service:
        condition: service_started
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD","curl","-f","http://api-gateway:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  auth-service:
