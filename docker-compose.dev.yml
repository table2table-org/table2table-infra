      discovery-server:
        condition: service_started
      config-service:
        condition: service_started
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD","curl","-f","http://auth-service:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  user-service:
